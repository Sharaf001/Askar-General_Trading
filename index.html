<title>Askar General Trading</title>
<style>
:root{--bg:#eef0f4;--card:#ffffff;--text:#4a4a4d;--muted:#7a7a7f;--accent:#d3262e;--border:#dfe2e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222327;--text:#ececee;--muted:#a0a1a8;--accent:#ef4a50;--border:#34353b}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222327;--text:#ececee;--muted:#a0a1a8;--accent:#ef4a50;--border:#34353b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:40px 20px 48px;text-align:center}
.logo{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;background:var(--card);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{margin:0 0 6px;font-size:26px}
p.sub{margin:0 0 30px;color:var(--muted);font-size:15px}
.links{display:flex;flex-direction:column;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);text-decoration:none;font-size:16px;font-weight:600;text-align:left;transition:transform .15s,border-color .15s}
a.btn:hover,a.btn:active{transform:translateY(-2px);border-color:var(--accent)}
a.btn svg{width:24px;height:24px;flex:none;fill:var(--accent)}
a.btn small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.bg svg{width:max(100%,520px);max-width:900px;margin-top:6vh;opacity:.28;fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;z-index:1}
</style>
</head>
